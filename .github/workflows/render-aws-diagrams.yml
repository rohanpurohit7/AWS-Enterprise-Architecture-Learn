name: Render AWS Architecture Diagrams

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - 'AWS-Enterprise-Architecture-Handbook/**'
      - '.github/workflows/render-aws-diagrams.yml'

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Graphviz and AWS diagram renderer
        run: |
          sudo apt-get update
          sudo apt-get install -y graphviz
          python -m pip install --upgrade pip
          pip install diagrams==0.24.4

      - name: Validate discovered diagram imports
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import ast
          import importlib
          from pathlib import Path

          root = Path('AWS-Enterprise-Architecture-Handbook')
          canonical = root / 'architecture-diagrams'
          failures = []
          sources = []

          for path in sorted(root.rglob('*.py')):
              if canonical in path.parents or path.name.startswith('__'):
                  continue
              lowered = {part.lower() for part in path.parts}
              if not ({'aws-diagrams', 'architecture-diagrams', 'diagrams'} & lowered):
                  continue
              sources.append(path)
              tree = ast.parse(path.read_text(encoding='utf-8'), filename=str(path))
              for node in ast.walk(tree):
                  if isinstance(node, ast.ImportFrom) and node.module:
                      try:
                          module = importlib.import_module(node.module)
                      except Exception as exc:
                          failures.append(f'{path}: cannot import {node.module}: {exc}')
                          continue
                      for alias in node.names:
                          if alias.name != '*' and not hasattr(module, alias.name):
                              failures.append(f'{path}: {alias.name} not found in {node.module}')

          if not sources:
              failures.append('No architecture diagram Python sources discovered')
          if failures:
              print('AWS architecture import validation failed:')
              for failure in failures:
                  print(f' - {failure}')
              raise SystemExit(1)
          print(f'Validated imports for {len(sources)} architecture sources')
          PY

      - name: Consolidate, render, and distribute architecture diagrams
        run: python AWS-Enterprise-Architecture-Handbook/scripts/render_aws_diagrams.py

      - name: Validate root and local publication coverage
        shell: bash
        run: |
          set -euo pipefail
          ROOT='AWS-Enterprise-Architecture-Handbook'
          CANON="$ROOT/architecture-diagrams"
          source_count=$(find "$CANON/sources" -maxdepth 1 -type f -name '*.py' | wc -l)
          root_png_count=$(find "$CANON/rendered" -maxdepth 1 -type f -name '*.png' | wc -l)
          compatibility_png_count=$(find "$ROOT/docs/diagrams/rendered" -maxdepth 1 -type f -name '*.png' | wc -l)
          echo "Root source count: $source_count"
          echo "Root rendered count: $root_png_count"
          echo "Compatibility rendered count: $compatibility_png_count"
          test "$source_count" -gt 0
          test "$root_png_count" -eq "$source_count"
          test "$compatibility_png_count" -eq "$source_count"
          test -f "$CANON/catalog.json"
          test -f "$CANON/README.md"
          test -f "$ROOT/docs/diagrams/README.md"
          grep -q 'How GitHub Actions Builds and Publishes the Diagrams' "$CANON/README.md"
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path('AWS-Enterprise-Architecture-Handbook')
          catalog = json.loads((root / 'architecture-diagrams' / 'catalog.json').read_text(encoding='utf-8'))
          failures = []
          for item in catalog['architectures']:
              central = Path(item['central_rendered_asset'])
              if not central.exists():
                  failures.append(f"Missing central image: {central}")
              for local in item['local_rendered_assets']:
                  if not Path(local).exists():
                      failures.append(f"Missing local image: {local}")
              for document in item['documents']:
                  text = Path(document).read_text(encoding='utf-8')
                  if 'GENERATED_ARCHITECTURE_DIAGRAM:START' not in text:
                      failures.append(f"Missing managed diagram block: {document}")
          if failures:
              print('\n'.join(failures))
              raise SystemExit(1)
          print(f"Validated {len(catalog['architectures'])} cataloged architectures")
          PY

      - name: Commit root library and distributed diagrams
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add AWS-Enterprise-Architecture-Handbook/architecture-diagrams
          git add AWS-Enterprise-Architecture-Handbook/docs/diagrams
          find AWS-Enterprise-Architecture-Handbook -type d -name rendered -print0 | xargs -0 -r git add
          git add 'AWS-Enterprise-Architecture-Handbook/**/*.md'
          if git diff --cached --quiet; then
            echo 'No generated architecture changes to commit.'
          else
            git commit -m 'docs: publish centralized and local AWS architecture diagrams [skip ci]'
            git push
          fi
